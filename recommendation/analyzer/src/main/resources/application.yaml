spring:
  application:
    name: analyzer
  config:
    import: optional:configserver:http://localhost:8888/
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000
        multiplier: 1.5

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/