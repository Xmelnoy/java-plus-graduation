services:

  users-db:
    image: postgres:16.1
    container_name: ewm-users-db
    ports:
      - "6503:5432"
    environment:
      POSTGRES_DB: ewm_users
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    volumes:
      - users-data:/var/lib/postgresql/data
      - ./core/users-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d ewm_users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

