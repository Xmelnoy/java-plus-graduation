server:
  port: 8080

spring:
  application:
    name: gateway-server
  main:
    web-application-type: reactive
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:

      discovery:
        locator:
          enabled: false
      routes:
        - id: comments-service
          uri: lb://comments-service
          order: -10
          predicates:
            - Path=/events/*/comments/**,/users/*/comments/**,/admin/comments/**
        - id: request-service
          uri: lb://request-service
          order: -5
          predicates:
            - Path=/requests/**,/users/*/requests/**,/users/*/events/*/requests/**
        - id: event-service
          uri: lb://event-service
          order: 0
          predicates:
            - Path=/events/**,/admin/events/**,/users/*/events/**
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/categories/**,/admin/categories/**
        - id: compilations-service
          uri: lb://compilations-service
          predicates:
            - Path=/compilations/**,/admin/compilations/**
        - id: location-service
          uri: lb://location-service
          predicates:
            - Path=/locations/**,/admin/locations/**
        - id: users-service
          uri: lb://users-service
          predicates:
            - Path=/users/**,/admin/users/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${random.value}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
